<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect x="1" y="1" width="22" height="22" rx="3" fill="#fbfbfb"/>

  <!-- BHE: ground surface with boreholes hanging below, drawn full-size then masked below -->
  <line x1="3.5" y1="6" x2="22.5" y2="6" stroke="#0067c0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="6" x2="6" y2="22" stroke="#0067c0" stroke-width="1.6"/>
  <line x1="12" y1="6" x2="12" y2="22" stroke="#0067c0" stroke-width="1.6"/>
  <line x1="18" y1="6" x2="18" y2="22" stroke="#0067c0" stroke-width="1.6"/>

  <!-- Mask: plain background triangle erasing BHE's spillover into the bottom-right half,
       with rounded corners (quadratic curves through each original vertex) -->
  <path d="M 21.73,2.27 Q 23,1 23,2.8 L 23,21.2 Q 23,23 21.2,23 L 2.8,23 Q 1,23 2.27,21.73 Z"
        fill="#fbfbfb"/>

  <!-- HHE: parallel horizontal trenches, hand-fit to start exactly on the diagonal so they never spill into the BHE half -->
  <line x1="18" y1="6" x2="20.5" y2="6" stroke="#0067c0" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="20.5" y2="12" stroke="#0067c0" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="6" y1="18" x2="20.5" y2="18" stroke="#0067c0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Diagonal divider, white underlay so the dashes read cleanly -->
  <line x1="1.5" y1="22" x2="22" y2="1.5" stroke="#fbfbfb" stroke-width="1.5"/>
  <line x1="1.5" y1="22" x2="22" y2="1.5" stroke="#5f5f5f" stroke-width="1" stroke-dasharray="2,1.5"/>

  <!-- Border, drawn last so it masks anything overrunning the rounded corners -->
  <rect x="1" y="1" width="22" height="22" rx="3" fill="none" stroke="#5f5f5f" stroke-width="1.4"/>
</svg>
